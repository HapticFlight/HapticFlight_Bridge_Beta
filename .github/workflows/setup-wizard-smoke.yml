name: Setup wizard smoke test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the Setup EXE
        required: true

permissions:
  contents: read

jobs:
  open-wizard:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download candidate installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Path candidate | Out-Null
          $version = $env:RELEASE_TAG.TrimStart('v')
          $name = "HapticFlight-Bridge-Setup-$version.exe"
          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          Invoke-WebRequest -Uri "$baseUrl/$name" -OutFile (Join-Path candidate $name)
          Invoke-WebRequest -Uri "$baseUrl/$name.sha256" -OutFile (Join-Path candidate "$name.sha256")
          $installer = @(Get-ChildItem candidate -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one Setup EXE.' }
          $expected = ((Get-Content ($installer[0].FullName + '.sha256') -Raw).Trim() -split '  ')[0]
          $actual = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Downloaded Setup checksum mismatch.' }

      - name: Open the actual Setup wizard without installing
        shell: pwsh
        run: |
          $installer = (Get-ChildItem candidate -Filter '*.exe' | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $installer -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Setup exited before its wizard opened (exit code $($process.ExitCode))." }
              $titles = @(Get-Process | Where-Object { $_.MainWindowTitle -match 'HapticFlight Bridge|^Setup$' } | ForEach-Object MainWindowTitle)
              if ($titles.Count -gt 0) { Write-Host "Setup windows: $($titles -join ', ')" }
              if ($titles -match 'HapticFlight Bridge') {
                Write-Host 'PASS: Setup wizard opened without a runtime error.'
                exit 0
              }
            } while ((Get-Date) -lt $deadline)
            throw "Setup did not open the expected wizard. Last window titles: $($titles -join ', ')"
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Install into disposable DCS and SimHub stand-ins
        shell: pwsh
        run: |
          $installer = (Get-ChildItem candidate -Filter '*.exe' | Select-Object -First 1).FullName
          $dcs = Join-Path $env:USERPROFILE 'Saved Games\DCS'
          $simHub = Join-Path ${env:ProgramFiles(x86)} 'SimHub'
          $app = Join-Path $env:RUNNER_TEMP 'HapticFlight Bridge'
          New-Item -ItemType Directory -Force -Path $dcs, $simHub | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $simHub 'SimHubWPF.exe') | Out-Null
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS /DIR=`"$app`" /LOG=`"$env:RUNNER_TEMP\setup.log`""
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -PassThru
          try { Wait-Process -Id $process.Id -Timeout 30 -ErrorAction Stop }
          catch {
            Get-Process | Where-Object MainWindowTitle | Select-Object ProcessName,MainWindowTitle | Format-Table -AutoSize
            if (Test-Path "$env:RUNNER_TEMP\setup.log") { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 80 }
            $crashLog = Join-Path $env:LOCALAPPDATA 'DcsExtraTelemetry\launcher-crash.log'
            if (Test-Path $crashLog) { Get-Content $crashLog -Tail 60 }
            Write-Host "App staged: $(Test-Path (Join-Path $app 'HapticFlight Bridge.exe'))"
            Write-Host "DCS hook staged: $(Test-Path (Join-Path $dcs 'Scripts\Hooks\DCSExtraTelemetry.lua'))"
            Write-Host "SimHub plugin staged: $(Test-Path (Join-Path $simHub 'DcsExtraTelemetry.Plugin.dll'))"
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Setup did not complete within 30 seconds.'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 60
            throw "Setup failed with exit code $($process.ExitCode)."
          }
          foreach ($path in @(
            (Join-Path $app 'HapticFlight Bridge.exe'),
            (Join-Path $dcs 'Scripts\Hooks\DCSExtraTelemetry.lua'),
            (Join-Path $simHub 'DcsExtraTelemetry.Plugin.dll')
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Setup did not install $path" }
          }
          Write-Host 'PASS: Setup installed the app and both integrations into disposable stand-ins.'

      - name: Launch the installed application
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'HapticFlight Bridge\HapticFlight Bridge.exe'
          $process = Start-Process -FilePath $app -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Installed app exited before showing its window (code $($process.ExitCode))." }
              if ($process.MainWindowTitle -match 'HapticFlight Bridge') {
                Write-Host "PASS: installed application opened: $($process.MainWindowTitle)"
                exit 0
              }
            } while ((Get-Date) -lt $deadline)
            throw 'Installed app did not show a window within 30 seconds.'
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
